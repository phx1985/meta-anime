# docker-compose.debug.yml
# 
# Docker Compose configuration for debugging the application
# This extends the base docker-compose.yml with debug-specific settings
# 
# Usage:
#   docker-compose -f docker-compose.yml -f docker-compose.debug.yml up
#   
# Or with override file:
#   docker-compose -f docker-compose.yml -f docker-compose.override.yml -f docker-compose.debug.yml up

services:
  meta-anime-api:
    build:
      context: .
      dockerfile: Dockerfile.debug
      target: debug
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DOTNET_USE_POLLING_FILE_WATCHER=true
      - ASPNETCORE_URLS=http://+:8080;https://+:8081
    volumes:
      # Mount source for live debugging
      - ./api:/src/api
      # Mount NuGet packages cache to speed up restore
      - ~/.nuget/packages:/root/.nuget/packages:ro
    ports:
      # Debugger port for Visual Studio
      - "4026:4026"
    stdin_open: true
    tty: true
    entrypoint: []
    command: ["dotnet", "watch", "run", "--project", "/src/api/MetaAnime.Presentation/MetaAnime.Presentation.csproj", "--no-launch-profile"]
