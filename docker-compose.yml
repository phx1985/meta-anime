services:
  ollama:
    image: ollama/ollama
    container_name: ollama
    restart: unless-stopped
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: metaanime
      POSTGRES_PASSWORD: metaanime
      POSTGRES_DB: metaanime
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metaanime -d metaanime"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ollama_data:
