# docker-compose.debug.yml
# 
# Docker Compose configuration for debugging the application
# This extends the base docker-compose.yml with debug-specific settings
# 
# Usage:
#   docker-compose -f docker-compose.yml -f docker-compose.debug.yml up
#   
# Or with override file:
#   docker-compose -f docker-compose.yml -f docker-compose.override.yml -f docker-compose.debug.yml up

services:
  meta-anime-api:
    build:
      context: .
      dockerfile: Dockerfile.debug
      target: debug
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DOTNET_USE_POLLING_FILE_WATCHER=true
      - ASPNETCORE_URLS=http://+:8080;https://+:8081
    volumes:
      # Mount source for live debugging
      - .:/src
      # Mount NuGet packages cache to speed up restore
      - ~/.nuget/packages:/root/.nuget/packages:ro
    ports:
      # Debugger port for Visual Studio
      - "4026:4026"
    stdin_open: true
    tty: true
    entrypoint: []
    command: ["dotnet", "watch", "run", "--project", "/src/MetaAnime.Presentation/MetaAnime.Presentation.csproj", "--no-launch-profile"]

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: meta-anime-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@metaanime.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin-servers.json:/pgadmin4/servers.json:ro
    networks:
      - meta-anime-network
    depends_on:
      - postgres

volumes:
  pgadmin_data:
    driver: local
