<div class="missing-stats-card">
  <div class="missing-header">
    <h3 class="missing-title">{{ 'home.missing.title' | translate }}</h3>
  </div>
  <div class="missing-rows">

    <!-- Sonarr not in MAL -->
    <div class="gap-row gap-row--sonarr-mal">
      <div class="gap-icon-pair" aria-hidden="true">
        <img src="assets/images/sonarr.svg" class="gap-src-img" alt="" />
        <div class="gap-tgt-wrap">
          <img src="assets/images/mal.svg" class="gap-tgt-img" alt="" />
        </div>
      </div>
      <div class="gap-info">
        <span class="gap-desc">{{ 'home.missing.sonarrNotInMalDesc' | translate }}</span>
      </div>
      <div class="gap-count" [class.gap-count--zero]="stats.sonarrNotInMal === 0" [countUp]="stats.sonarrNotInMal"></div>
    </div>

    <!-- MAL not in Plex -->
    <div class="gap-row gap-row--mal-plex">
      <div class="gap-icon-pair" aria-hidden="true">
        <img src="assets/images/mal.svg" class="gap-src-img" alt="" />
        <div class="gap-tgt-wrap">
          <img src="assets/images/plex.svg" class="gap-tgt-img" alt="" />
        </div>
      </div>
      <div class="gap-info">
        <span class="gap-desc">{{ 'home.missing.malNotInPlexDesc' | translate }}</span>
      </div>
      <div class="gap-count" [class.gap-count--zero]="stats.malNotInPlex === 0" [countUp]="stats.malNotInPlex"></div>
    </div>

    <!-- Plex not in MAL -->
    <div class="gap-row gap-row--plex-mal">
      <div class="gap-icon-pair" aria-hidden="true">
        <img src="assets/images/plex.svg" class="gap-src-img" alt="" />
        <div class="gap-tgt-wrap">
          <img src="assets/images/mal.svg" class="gap-tgt-img" alt="" />
        </div>
      </div>
      <div class="gap-info">
        <span class="gap-desc">{{ 'home.missing.plexNotInMalDesc' | translate }}</span>
      </div>
      <div class="gap-count" [class.gap-count--zero]="stats.plexNotInMal === 0" [countUp]="stats.plexNotInMal"></div>
    </div>

    <!-- Plex not in Sonarr -->
    <div class="gap-row gap-row--plex-sonarr">
      <div class="gap-icon-pair" aria-hidden="true">
        <img src="assets/images/plex.svg" class="gap-src-img" alt="" />
        <div class="gap-tgt-wrap">
          <img src="assets/images/sonarr.svg" class="gap-tgt-img" alt="" />
        </div>
      </div>
      <div class="gap-info">
        <span class="gap-desc">{{ 'home.missing.plexNotInSonarrDesc' | translate }}</span>
      </div>
      <div class="gap-count" [class.gap-count--zero]="stats.plexNotInSonarr === 0" [countUp]="stats.plexNotInSonarr"></div>
    </div>

  </div>
</div>
