<div class="container py-5">
  <h1 class="anime-list-title mb-4">{{ 'animeList.title' | translate }}</h1>

  @if (loading()) {
    <div class="d-flex justify-content-center py-5">
      <div class="spinner-border" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>
  } @else if (error()) {
    <div class="alert alert-danger" role="alert">
      {{ 'animeList.error' | translate }}
    </div>
  } @else if (animes().length === 0) {
    <p class="text-muted">{{ 'animeList.empty' | translate }}</p>
  } @else {
    <ul class="anime-names-list list-unstyled">
      @for (anime of animes(); track anime.Id) {
        <li class="anime-name-item">{{ anime.Title }}</li>
      }
    </ul>
  }
</div>
