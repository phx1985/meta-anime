<div
  class="mal-qu-backdrop"
  [class.mal-qu-backdrop--leaving]="leaving()"
  (click)="dismiss()"
  role="dialog"
  aria-modal="true"
  [attr.aria-label]="'malQuickUpdate.title' | translate"
>
  <div
    class="mal-qu-modal"
    [class.mal-qu-modal--leaving]="leaving()"
    (click)="$event.stopPropagation()"
  >
    <!-- Close button -->
    <button
      type="button"
      class="mal-qu-close"
      (click)="dismiss()"
      [attr.aria-label]="'common.close' | translate"
    >
      <svg
        width="12"
        height="12"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.8"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <line x1="18" y1="6" x2="6" y2="18" />
        <line x1="6" y1="6" x2="18" y2="18" />
      </svg>
    </button>

    <!-- ── Header: cover + title ── -->
    <div class="mal-qu-header">
      @if (ctx()?.coverImageUrl) {
        <img
          class="mal-qu-cover"
          [src]="ctx()!.coverImageUrl"
          [alt]="ctx()!.title"
          loading="eager"
        />
      } @else {
        <div class="mal-qu-cover mal-qu-cover--placeholder" aria-hidden="true">
          {{ ctx()?.title?.charAt(0) }}
        </div>
      }
      <div class="mal-qu-header-text">
        <h3 class="mal-qu-title">{{ ctx()?.title }}</h3>
      </div>
    </div>

    <!-- ── Watch Status ── -->
    <div class="mal-qu-section mal-qu-section--compact">
      <label class="mal-qu-label">{{ 'malQuickUpdate.status' | translate }}</label>
      <div class="mal-qu-status-grid" role="radiogroup" [attr.aria-label]="'malQuickUpdate.status' | translate">
        @for (s of statuses; track s) {
          <button
            type="button"
            class="mal-qu-status-btn mal-qu-status-btn--{{ s }}"
            [class.mal-qu-status-btn--active]="selectedStatus() === s"
            (click)="selectStatus(s)"
            role="radio"
            [attr.aria-checked]="selectedStatus() === s"
          >
            {{ 'animeDetailPanel.malStatus.' + s | translate }}
          </button>
        }
      </div>
    </div>

    <!-- ── Episodes Watched ── -->
    <div class="mal-qu-section mal-qu-section--compact">
      <label class="mal-qu-label" for="mal-qu-eps">
        {{ 'malQuickUpdate.episodes' | translate }}
        @if (ctx()?.totalEpisodes) {
          <span class="mal-qu-total">/ {{ ctx()!.totalEpisodes }}</span>
        }
      </label>
      <div class="mal-qu-stepper">
        <button
          type="button"
          class="mal-qu-step-btn"
          (click)="decrementEpisodes()"
          [disabled]="episodesWatched() <= 0"
          [attr.aria-label]="'aria.decreaseEpisodes' | translate"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
            <line x1="5" y1="12" x2="19" y2="12" />
          </svg>
        </button>
        <input
          id="mal-qu-eps"
          type="number"
          class="mal-qu-eps-input"
          [value]="episodesWatched()"
          min="0"
          [max]="ctx()?.totalEpisodes ?? 99999"
          (change)="onEpisodesInput($event)"
          (blur)="onEpisodesInput($event)"
          [attr.aria-label]="'aria.episodesWatched' | translate"
        />
        <button
          type="button"
          class="mal-qu-step-btn"
          (click)="incrementEpisodes()"
          [disabled]="ctx()?.totalEpisodes != null && episodesWatched() >= (ctx()?.totalEpisodes ?? 99999)"
          [attr.aria-label]="'aria.increaseEpisodes' | translate"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
            <line x1="12" y1="5" x2="12" y2="19" />
            <line x1="5" y1="12" x2="19" y2="12" />
          </svg>
        </button>
      </div>
    </div>

    <!-- ── Score ── -->
    <div class="mal-qu-section">
      <label class="mal-qu-label">
        {{ 'malQuickUpdate.score' | translate }}
        @if (showScoreRequired()) {
          <span class="mal-qu-score-required">{{ 'malQuickUpdate.scoreRequired' | translate }}</span>
        }
      </label>

      <!-- Mobile: semi-circular dial (hidden on desktop) -->
      <div class="mal-qu-score-dial">
        <div
          class="mal-qu-dial-wrap"
          [class.mal-qu-dial-wrap--required]="showScoreRequired()"
        >
          <!-- SVG semi-circle -->
          <svg
            class="mal-qu-dial-svg"
            viewBox="0 0 200 110"
            aria-hidden="true"
            focusable="false"
          >
            <defs>
              <linearGradient id="malDialGrad" gradientUnits="userSpaceOnUse" x1="10" y1="100" x2="190" y2="100">
                <stop offset="0%"   stop-color="#ef4444" />
                <stop offset="33%"  stop-color="#f59e0b" />
                <stop offset="66%"  stop-color="#3b82f6" />
                <stop offset="100%" stop-color="#22c55e" />
              </linearGradient>
            </defs>

            <!-- Track arc -->
            <path
              class="mal-qu-dial-track"
              d="M 10 100 A 90 90 0 0 1 190 100"
              fill="none"
              stroke-width="10"
              stroke-linecap="round"
            />

            <!-- Fill arc -->
            <path
              class="mal-qu-dial-fill"
              d="M 10 100 A 90 90 0 0 1 190 100"
              fill="none"
              stroke="url(#malDialGrad)"
              stroke-width="10"
              stroke-linecap="round"
              stroke-dasharray="282.74"
              [style.stroke-dashoffset]="dialDashoffset()"
            />

            <!-- Thumb dot (hidden when score = 0) -->
            @if (selectedScore() > 0) {
              <circle
                class="mal-qu-dial-thumb"
                [attr.cx]="dialThumbX()"
                [attr.cy]="dialThumbY()"
                r="7"
              />
            }
          </svg>

          <!-- Center score display -->
          <div class="mal-qu-dial-display">
            @if (selectedScore() > 0) {
              <span class="mal-qu-dial-value">{{ selectedScore() }}</span>
              <span class="mal-qu-dial-max">/10</span>
            } @else {
              <span class="mal-qu-dial-unset">—</span>
            }
          </div>

          <!-- Invisible range control — covers the entire container -->
          <input
            type="range"
            class="mal-qu-dial-input"
            min="0"
            max="10"
            step="1"
            [value]="selectedScore()"
            (input)="onDialInput($event)"
            [attr.aria-label]="'malQuickUpdate.score' | translate"
            [attr.aria-valuenow]="selectedScore()"
            aria-valuemin="0"
            aria-valuemax="10"
          />
        </div>
      </div>

      <!-- Desktop: circular chip row (hidden on mobile) -->
      <div
        class="mal-qu-pc-score-row"
        [class.mal-qu-pc-score-row--required]="showScoreRequired()"
        role="radiogroup"
        [attr.aria-label]="'malQuickUpdate.score' | translate"
      >
        @for (n of scores; track n) {
          <button
            type="button"
            class="mal-qu-pc-score-btn"
            [class.mal-qu-pc-score-btn--filled]="selectedScore() >= n && selectedScore() > 0"
            [class.mal-qu-pc-score-btn--active]="selectedScore() === n"
            (click)="selectScore(n)"
            role="radio"
            [attr.aria-checked]="selectedScore() === n"
            [attr.title]="n"
          >{{ n }}</button>
        }
      </div>
    </div>

    <!-- ── Save button ── -->
    <div class="mal-qu-footer">
      <button type="button" class="mal-qu-cancel-btn" (click)="dismiss()">
        {{ 'common.cancel' | translate }}
      </button>
      <button
        type="button"
        class="mal-qu-save-btn"
        (click)="save()"
        [disabled]="saving() || !canSave()"
      >
        @if (saving()) {
          <span class="mal-qu-spinner" aria-hidden="true"></span>
        }
        {{ saving() ? ('malQuickUpdate.saving' | translate) : ('malQuickUpdate.save' | translate) }}
      </button>
    </div>
  </div>
</div>
