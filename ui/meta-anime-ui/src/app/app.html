<nav class="navbar navbar-expand-lg sticky-top">
  <div class="container">
    <a class="navbar-brand" routerLink="/">Meta Anime</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
            aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
            {{ 'nav.home' | translate }}
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/animes" routerLinkActive="active">
            {{ 'nav.animes' | translate }}
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/settings" routerLinkActive="active">
            {{ 'nav.settings' | translate }}
          </a>
        </li>
      </ul>
      <div class="navbar-actions d-flex flex-wrap align-items-center gap-2 py-2 py-lg-0">
        <button class="btn btn-sm btn-outline-secondary" (click)="toggleTheme()">
          @if (themeService.isDarkTheme()) { ☀️ } @else { 🌙 }
          {{ 'theme.toggle' | translate }}
        </button>
        <button class="btn btn-sm btn-outline-secondary" (click)="switchLanguage()">
          {{ 'lang.switch' | translate }}
        </button>
      </div>
    </div>
  </div>
</nav>

<router-outlet />
