<div class="la-pills">
  <div class="la-pill">
    <div class="la-pill__top">
      <span class="la-pill__value" [countUp]="totalSizeDisplay().value"></span>
      <span class="la-pill__unit">{{ totalSizeDisplay().unit }}</span>
    </div>
    <span class="la-pill__label">{{ 'library.pills.totalSpace' | translate }}</span>
  </div>

  <div class="la-pill">
    <div class="la-pill__top">
      <span class="la-pill__value" [countUp]="totalFileCount()"></span>
    </div>
    <span class="la-pill__label">{{ 'library.pills.totalFiles' | translate }}</span>
  </div>

  <div class="la-pill la-pill--warning la-pill--clickable"
       [title]="'library.pills.missingFilesHint' | translate"
       (click)="missingFilesClick.emit()">
    <div class="la-pill__top">
      <span class="la-pill__value" [countUp]="missingSeriesCount()"></span>
    </div>
    <span class="la-pill__label">{{ 'library.pills.seriesWithMissingFiles' | translate }}</span>
    <span class="la-pill__hint">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>
      </svg>
      {{ 'library.pills.missingFilesHint' | translate }}
    </span>
  </div>
</div>
