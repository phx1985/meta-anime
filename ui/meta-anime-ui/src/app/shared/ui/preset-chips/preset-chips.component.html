<div class="preset-chips">
  @for (p of presets(); track p.id) {
    @let label = p.isBuiltIn ? (p.labelKey | translate) : p.labelKey;
    <button
      type="button"
      class="preset-chip"
      [class.preset-chip--builtin]="p.isBuiltIn"
      [class.preset-chip--saved]="!p.isBuiltIn"
      [class.preset-chip--active]="activeName() === label"
      [attr.aria-label]="label"
      [attr.aria-current]="activeName() === label ? 'true' : null"
      (click)="apply.emit(p)"
    >
      {{ label }}
      @if (showCheck() && activeName() === label) {
        <svg
          class="preset-chip__check"
          width="12"
          height="12"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M20 6L9 17l-5-5" />
        </svg>
      }
      @if (!p.isBuiltIn) {
        <span
          class="preset-chip__delete"
          role="button"
          tabindex="0"
          [attr.aria-label]="deleteLabel()"
          (click)="onDelete(p.id, $event)"
          (keydown.enter)="onDelete(p.id, $event)"
          (keydown.space)="$event.preventDefault(); onDelete(p.id, $event)"
        >
          <svg
            width="8"
            height="8"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <path d="M18 6L6 18M6 6l12 12" />
          </svg>
        </span>
      }
    </button>
  }
</div>
