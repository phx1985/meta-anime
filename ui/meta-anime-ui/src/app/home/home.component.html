<section class="hero-section" aria-label="Hero">
  <!-- Background image layer -->
  <div class="hero-image" aria-hidden="true"></div>

  <!-- Bottom vignette – contrast for text readability -->
  <div class="hero-vignette" aria-hidden="true"></div>

  <!-- Film grain overlay (filter defined globally in index.html) -->
  <div class="hero-noise" aria-hidden="true"></div>

  <!-- Animated floating bubbles -->
  <div class="particles" aria-hidden="true">
    @for (p of particles; track $index) {
      <span class="particle"></span>
    }
  </div>

  <!-- Hero text – absolutely pinned to the bottom of the banner -->
  <div class="hero-content">
    <h1 class="hero-title">{{ 'home.title' | translate }}</h1>
    <p class="hero-subtitle">{{ 'home.subtitle' | translate }}</p>
  </div>
</section>

<!-- Stats -->
<div class="stats-section container py-5">
  @if (stats()) {
    <!-- Source counters -->
    <div class="row g-4 mb-3 justify-content-center">
      @if (providerState.plexEnabled()) {
        <div [class]="colClass()">
          <div
            class="stat-card stat-card--plex"
            [attr.data-tooltip]="'home.stats.tooltip.plex' | translate"
          >
            <div class="stat-value" [countUp]="stats()!.plexAnime"></div>
            <img class="stat-icon" src="assets/images/plex.svg" alt="Plex" aria-hidden="true" />
          </div>
        </div>
      }
      @if (providerState.sonarrEnabled()) {
        <div [class]="colClass()">
          <div
            class="stat-card stat-card--sonarr"
            [attr.data-tooltip]="'home.stats.tooltip.sonarr' | translate"
          >
            <div class="stat-value" [countUp]="stats()!.sonarrAnime"></div>
            <img class="stat-icon" src="assets/images/sonarr.svg" alt="Sonarr" aria-hidden="true" />
          </div>
        </div>
      }
      <div [class]="colClass()">
        <div
          class="stat-card stat-card--mal"
          [attr.data-tooltip]="'home.stats.tooltip.mal' | translate"
        >
          <div class="stat-value" [countUp]="stats()!.myAnimeListAnime"></div>
          <img class="stat-icon" src="assets/images/mal.svg" alt="MyAnimeList" aria-hidden="true" />
        </div>
      </div>
    </div>
    <p class="text-center stats-desc mb-5">{{ 'home.stats.description' | translate }}</p>

    <!-- Charts + missing stats -->
    <div class="row g-4 align-items-stretch">
      <div class="col-12 col-lg-7">
        <app-genre-chart [genreStats]="stats()!.genreStats" />
      </div>
      <div class="col-12 col-lg-5">
        <app-missing-stats [stats]="stats()!" (gapCountDecremented)="onGapCountDecremented($event)" />
      </div>
    </div>
  } @else {
    <div class="d-flex justify-content-center py-5">
      <div class="spinner-border" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>
  }
</div>

<!-- Gallery overlay — used by AnimeDetailPanel when opened from the home page -->
<app-anime-image-gallery />
