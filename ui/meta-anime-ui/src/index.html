<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Meta Anime</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="assets/images/meta-anime-favicon.png" />
  </head>
  <body>
    <!-- Global SVG filter definitions – must be in the document body to be
       accessible from any CSS url(#) reference regardless of component scope -->
    <svg
      id="global-svg-filters"
      aria-hidden="true"
      focusable="false"
      style="position: absolute; width: 0; height: 0; overflow: hidden"
    >
      <defs>
        <filter
          id="hero-grain"
          x="0%"
          y="0%"
          width="100%"
          height="100%"
          color-interpolation-filters="linearRGB"
        >
          <feTurbulence
            type="fractalNoise"
            baseFrequency="0.68"
            numOctaves="4"
            stitchTiles="stitch"
            result="noise"
          >
            <animate attributeName="seed" from="0" to="999" dur="0.4s" repeatCount="indefinite" />
          </feTurbulence>
          <feColorMatrix type="saturate" values="0" in="noise" />
        </filter>
      </defs>
    </svg>

    <app-root></app-root>
  </body>
</html>
